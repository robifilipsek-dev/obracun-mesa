<!DOCTYPE html>
<html lang="sl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izračun cene goriva — dizel & bencin 95</title>

<!-- Standardna SVG ikona za PC brskalnik (zaznamki, zavihki) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z'/></svg>">

<script>
tailwind.config={

  theme:{
    extend:{
      colors:{

          amber:'#f59e0b',

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -.011em; }
.mono { font-family: 'JetBrains Mono', monospace; }
.card { background: rgba(24, 24, 27, 0.94); border: 1px solid #3f3f46; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.input { background: #09090b; border: 1px solid #3f3f46; color: #fafafa; border-radius: 10px; padding: .75rem 1rem; font-size: .9rem; width: 100%; outline: none; transition: all 0.2s; }

body.theme-diesel .input:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12); }
body.theme-petrol .input:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12); }

input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.label { display: block; font-size: .75rem; font-weight: 700; color: #d4d4d8; margin-bottom: .4rem; }
.result { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

<body class="theme-diesel bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

<div class="max-w-md w-full space-y-4">
  
  <!-- Zavihki (Tabs) za preklop goriv -->
  <div class="grid grid-cols-2 gap-2 p-1.5 bg-zinc-900 border border-zinc-800 rounded-2xl">
    <button id="tab-diesel" onclick="switchFuelTab('diesel')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-amber-500/10 text-amber-400 border border-amber-500/30 shadow-sm">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z"/>
      </svg>
      <span>Dizelsko gorivo</span>
    </button>
    <button id="tab-petrol" onclick="switchFuelTab('petrol')" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-zinc-400 hover:text-zinc-200 border border-transparent">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z"/>
      </svg>
      <span>Bencin 95</span>
    </button>
  </div>

  <div class="card p-6 space-y-6 relative overflow-hidden">
    
    <!-- Glava kartice z gumbom za PWA namestitev -->
    <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
      <div>
        <h1 id="app-title" class="text-xl font-extrabold tracking-tight text-white">Izračun cene dizla</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Slovenija • Shranjevanje cene na napravi</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="installAppBtn" onclick="installPWA()" title="Namesti aplikacijo" class="hidden w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-amber-400 items-center justify-center shrink-0 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        </button>
        <div id="fuel-icon-bg" class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 transition-colors duration-200">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Vnosna polja -->
    <div class="space-y-4">
      <div>
        <div class="flex justify-between items-center mb-1">
          <label id="price-label" class="label mb-0">Cena dizla [€/l]</label>
          <span id="price-status" class="text-[10px] text-zinc-400">Preverjam ceno …</span>
        </div>
        <div class="relative">
          <input id="fuel-price" class="input pr-16 font-bold text-amber-300 transition-colors duration-200" type="number" step="0.001" oninput="calculate()" onkeypress="allowComma(event)">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">€ / l</div>
        </div>
        <div class="flex items-center justify-between mt-1.5">
          <span id="price-date" class="text-[10px] text-zinc-500"></span>
          <button id="refresh-btn" onclick="fetchFuelPrices()" class="text-[10px] font-bold text-amber-400 hover:text-amber-300 flex items-center gap-1 transition-colors">
            <span>↻ Osveži GOV.SI</span>
          </button>
        </div>
      </div>

      <div>
        <label class="label">Količina točenega goriva [litri]</label>
        <input id="liters" class="input" type="number" step="0.01" oninput="calculate()" onkeypress="allowComma(event)">
      </div>

      <div>
        <label class="label">Popust [centi na liter]</label>
        <div class="relative">
          <input id="discount" class="input pr-16" type="number" step="0.1" value="0" oninput="calculate()" onkeypress="allowComma(event)">
          <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">centov</div>
        </div>
      </div>
    </div>

    <!-- Prikaz rezultatov -->
    <div class="border-t border-zinc-800 pt-5 space-y-3">
      <div class="flex justify-between text-xs text-zinc-400">
        <span>Osnovna cena brez popusta:</span>
        <span id="base-total" class="result text-zinc-200">0.00 €</span>
      </div>
      <div class="flex justify-between text-xs text-zinc-400">
        <span>Skupni prihranek:</span>
        <span id="total-saving" class="result text-emerald-400">-0.00 €</span>
      </div>
      <div id="final-box" class="bg-zinc-900 border border-amber-500/30 rounded-xl p-4 flex items-center justify-between transition-all duration-200">
        <div>
          <div id="final-label" class="text-[11px] font-bold text-amber-300 uppercase tracking-wider transition-colors duration-200">Znesek za plačilo</div>
          <div class="text-2xl md:text-3xl font-extrabold text-amber-400 result mt-0.5 transition-colors duration-200" id="final-price">0.00 €</div>
        </div>
        <button id="copyBtn" onclick="copyResult()" class="px-3 py-2 text-xs font-bold rounded-lg bg-amber-500 hover:bg-amber-400 active:scale-95 text-zinc-950 transition-all duration-200 shadow-md">
          Kopiraj
        </button>
      </div>
    </div>

    <!-- Grafikon -->
    <div class="border-t border-zinc-800 pt-5 space-y-3">
      <div class="flex items-center justify-between">
        <span id="chart-title" class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Gibanje cene dizla (Zadnja 2 meseca)</span>
        <span class="text-[10px] text-zinc-500">Zgodovina GOV.SI</span>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-3">
        <canvas id="priceChart" width="400" height="200"></canvas>
      </div>
    </div>

  </div>

  <div id="toast" class="toast-msg pointer-events-none fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-800 border border-zinc-700 text-zinc-200 px-4 py-2 rounded-xl text-xs font-semibold shadow-xl z-50 text-center">
    Znesek kopiran v odložišče!
  </div>
</div>

<script>
let activeTab = 'diesel';
let priceChartInstance = null;
let deferredPrompt = null;

let fuelData = {
  diesel: { price: '', discount: '0', historyLabels: [], historyPrices: [], lastDate: '' },
  petrol: { price: '', discount: '0', historyLabels: [], historyPrices: [], lastDate: '' }
};

function generatePumpPngDataUrl(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.22);
  ctx.fill();

  ctx.strokeStyle = '#27272a';
  ctx.lineWidth = size * 0.03;
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  const pathData = new Path2D('M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z');

  ctx.save();
  const scale = (size * 0.55) / 24;
  const offset = (size - 24 * scale) / 2;
  ctx.translate(offset, offset);
  ctx.scale(scale, scale);
  ctx.fill(pathData);
  ctx.restore();

  return canvas.toDataURL('image/png');
}

function injectDynamicManifest() {
  const pngDataUri = generatePumpPngDataUrl(512);

  let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
  if (!appleIcon) {
    appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    document.head.appendChild(appleIcon);
  }
  appleIcon.href = pngDataUri;

  const manifestData = {
    name: "Cene Goriva",
    short_name: "Gorivo",
    start_url: "./",
    display: "standalone",
    background_color: "#09090b",
    theme_color: "#09090b",
    icons: [
      { src: pngDataUri, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: pngDataUri, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };

  const stringManifest = JSON.stringify(manifestData);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  
  let manifestLink = document.querySelector('link[rel="manifest"]');
  if (!manifestLink) {
    manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    document.head.appendChild(manifestLink);
  }
  manifestLink.href = manifestURL;
}

function checkInstallState() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const installBtn = document.getElementById('installAppBtn');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  if (isStandalone) {
    if (installBtn) {
      installBtn.classList.add('hidden');
      installBtn.classList.remove('flex');
    }
  } else if (deferredPrompt || isIOS) {
    if (installBtn) {
      installBtn.classList.remove('hidden');
      installBtn.classList.add('flex');
    }
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  checkInstallState();
});

async function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      checkInstallState();
    }
    deferredPrompt = null;
  } else {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      showToast("Klikni gumb 'Deli' (spodaj v Safariju) in izberi 'Dodaj na domači zaslon'!");
    } else {
      showToast("Aplikacijo dodaš preko menija brskalnika: 'Dodaj na domači zaslon'.");
    }
  }
}

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  checkInstallState();
  showToast("Aplikacija je bila uspešno nameščena!");
});

function allowComma(e) {
  if (e.key === ',') {
    e.preventDefault();
    const input = e.target;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + '.' + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + 1;
    input.dispatchEvent(new Event('input'));
  }
}

function switchFuelTab(tab) {
  saveCurrentTabInputs();

  activeTab = tab;
  localStorage.setItem('active_fuel_tab', tab);

  const bodyEl = document.body;
  const tabDieselBtn = document.getElementById('tab-diesel');
  const tabPetrolBtn = document.getElementById('tab-petrol');
  const titleEl = document.getElementById('app-title');
  const priceLabel = document.getElementById('price-label');
  const chartTitle = document.getElementById('chart-title');
  const iconBg = document.getElementById('fuel-icon-bg');
  const copyBtn = document.getElementById('copyBtn');
  const fuelPriceInput = document.getElementById('fuel-price');
  const refreshBtn = document.getElementById('refresh-btn');
  const finalBox = document.getElementById('final-box');
  const finalLabel = document.getElementById('final-label');
  const finalPrice = document.getElementById('final-price');
  const installBtn = document.getElementById('installAppBtn');

  if (tab === 'diesel') {
    bodyEl.className = "theme-diesel bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 flex items-center justify-center";
    tabDieselBtn.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-amber-500/10 text-amber-400 border border-amber-500/30 shadow-sm";
    tabPetrolBtn.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-zinc-400 hover:text-zinc-200 border border-transparent";
    
    titleEl.textContent = "Izračun cene dizla";
    priceLabel.textContent = "Cena dizla [€/l]";
    chartTitle.textContent = "Gibanje cene dizla (Zadnja 2 meseca)";
    iconBg.className = "w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 transition-colors duration-200";
    
    fuelPriceInput.className = "input pr-16 font-bold text-amber-300 transition-colors duration-200";
    refreshBtn.className = "text-[10px] font-bold text-amber-400 hover:text-amber-300 flex items-center gap-1 transition-colors";
    
    finalBox.className = "bg-zinc-900 border border-amber-500/30 rounded-xl p-4 flex items-center justify-between transition-all duration-200";
    finalLabel.className = "text-[11px] font-bold text-amber-300 uppercase tracking-wider transition-colors duration-200";
    finalPrice.className = "text-2xl md:text-3xl font-extrabold text-amber-400 result mt-0.5 transition-colors duration-200";
    
    copyBtn.className = "px-3 py-2 text-xs font-bold rounded-lg bg-amber-500 hover:bg-amber-400 active:scale-95 text-zinc-950 transition-all duration-200 shadow-md";
    
    if (installBtn) {
      installBtn.classList.remove('text-cyan-400');
      installBtn.classList.add('text-amber-400');
    }
  } else {
    bodyEl.className = "theme-petrol bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 flex items-center justify-center";
    tabPetrolBtn.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 shadow-sm";
    tabDieselBtn.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-zinc-400 hover:text-zinc-200 border border-transparent";
    
    titleEl.textContent = "Izračun cene bencina 95";
    priceLabel.textContent = "Cena bencina 95 [€/l]";
    chartTitle.textContent = "Gibanje cene bencina 95 (Zadnja 2 meseca)";
    iconBg.className = "w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center shrink-0 transition-colors duration-200";
    
    fuelPriceInput.className = "input pr-16 font-bold text-cyan-300 transition-colors duration-200";
    refreshBtn.className = "text-[10px] font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-1 transition-colors";

    finalBox.className = "bg-zinc-900 border border-cyan-500/30 rounded-xl p-4 flex items-center justify-between transition-all duration-200";
    finalLabel.className = "text-[11px] font-bold text-cyan-300 uppercase tracking-wider transition-colors duration-200";
    finalPrice.className = "text-2xl md:text-3xl font-extrabold text-cyan-400 result mt-0.5 transition-colors duration-200";

    copyBtn.className = "px-3 py-2 text-xs font-bold rounded-lg bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-zinc-950 transition-all duration-200 shadow-md";
    
    if (installBtn) {
      installBtn.classList.remove('text-amber-400');
      installBtn.classList.add('text-cyan-400');
    }
  }

  loadTabInputs();
  calculate();
  updateChart();
}

function saveCurrentTabInputs() {
  const p = document.getElementById('fuel-price').value.replace(',', '.');
  const d = document.getElementById('discount').value.replace(',', '.');
  const l = document.getElementById('liters').value.replace(',', '.');

  fuelData[activeTab].price = p;
  fuelData[activeTab].discount = d;

  const discountKey = activeTab === 'diesel' ? 'diesel_discount' : 'petrol95_discount';

  if (p !== '') localStorage.setItem(activeTab + '_price', p);
  localStorage.setItem(discountKey, d);
  localStorage.setItem('fuel_liters', l);
}

function loadTabInputs() {
  const discountKey = activeTab === 'diesel' ? 'diesel_discount' : 'petrol95_discount';
  const savedDiscount = localStorage.getItem(discountKey);

  if (savedDiscount !== null) {
    fuelData[activeTab].discount = savedDiscount;
  }

  document.getElementById('fuel-price').value = fuelData[activeTab].price || '';
  document.getElementById('discount').value = fuelData[activeTab].discount !== undefined ? fuelData[activeTab].discount : '0';
  
  const savedLiters = localStorage.getItem('fuel_liters');
  document.getElementById('liters').value = savedLiters !== null ? savedLiters : '';
}

function calculate() {
  let priceInput = document.getElementById('fuel-price').value.replace(',', '.');
  let discountInput = document.getElementById('discount').value.replace(',', '.');
  let litersInput = document.getElementById('liters').value.replace(',', '.');

  let pricePerLitre = parseFloat(priceInput) || 0;
  let liters = parseFloat(litersInput) || 0;
  let discountCents = parseFloat(discountInput) || 0;

  fuelData[activeTab].price = priceInput;
  fuelData[activeTab].discount = discountInput;

  const discountKey = activeTab === 'diesel' ? 'diesel_discount' : 'petrol95_discount';

  if (priceInput !== '') localStorage.setItem(activeTab + '_price', priceInput);
  localStorage.setItem(discountKey, discountInput);
  localStorage.setItem('fuel_liters', litersInput);

  let discountPerLitre = discountCents / 100;
  let effectivePricePerLitre = Math.max(0, pricePerLitre - discountPerLitre);

  let baseTotal = pricePerLitre * liters;
  let finalTotal = effectivePricePerLitre * liters;
  let totalSaving = baseTotal - finalTotal;

  document.getElementById('base-total').textContent = baseTotal.toFixed(2) + ' €';
  document.getElementById('total-saving').textContent = '-' + totalSaving.toFixed(2) + ' €';
  document.getElementById('final-price').textContent = finalTotal.toFixed(2) + ' €';
}

function updateChart() {
  const ctx = document.getElementById('priceChart').getContext('2d');
  const labels = fuelData[activeTab].historyLabels || [];
  const prices = fuelData[activeTab].historyPrices || [];
  const isDiesel = activeTab === 'diesel';

  const color = isDiesel ? '#f59e0b' : '#06b6d4';
  const bgGradient = isDiesel ? 'rgba(245, 158, 11, 0.12)' : 'rgba(6, 182, 212, 0.12)';

  if (priceChartInstance) {
    priceChartInstance.data.labels = labels;
    priceChartInstance.data.datasets[0].data = prices;
    priceChartInstance.data.datasets[0].label = isDiesel ? 'Cena dizla (€/l)' : 'Cena bencina 95 (€/l)';
    priceChartInstance.data.datasets[0].borderColor = color;
    priceChartInstance.data.datasets[0].backgroundColor = bgGradient;
    priceChartInstance.data.datasets[0].pointBackgroundColor = color;
    priceChartInstance.update();
    return;
  }

  priceChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: isDiesel ? 'Cena dizla (€/l)' : 'Cena bencina 95 (€/l)',
        data: prices,
        borderColor: color,
        backgroundColor: bgGradient,
        borderWidth: 2,
        fill: true,
        tension: 0,
        pointBackgroundColor: color,
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) { return context.parsed.y.toFixed(3) + ' €/l'; }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { color: '#a1a1aa', font: { size: 8 }, maxRotation: 45, minRotation: 45 }
        },
        y: {
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { 
            color: '#a1a1aa', 
            font: { size: 10 },
            callback: function(value) { return value.toFixed(3); }
          }
        }
      }
    }
  });
}

function parseDate(dateStr, year) {
  const parts = dateStr.replace(/\s/g, '').split('.');
  return new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
}

async function fetchFuelPrices() {
  const status = document.getElementById('price-status');
  const dateEl = document.getElementById('price-date');
  status.textContent = 'Preverjam podatke z GOV.SI …';
  status.className = 'text-[10px] text-yellow-400';

  const target = 'https://www.gov.si/teme/cene-naftnih-derivatov/';
  const urls = [
    'https://r.jina.ai/' + target,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
    'https://corsproxy.io/?url=' + encodeURIComponent(target)
  ];

  let historyFetched = false;

  for (const url of urls) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);
      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeout);
      
      if (!response.ok) continue;
      let text = await response.text();
      if (!text || text.length < 100) continue;

      let cleanText = text.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\u00A0/g, ' ');

      let dieselHistory = [];
      let petrolHistory = [];

      const regex = /od\s+(\d{1,2}\.\s*\d{1,2}\.)\s*do\s+(\d{1,2}\.\s*\d{1,2}\.)[^\d]{0,50}(\d{4})[^\d]{0,100}?([1-4][.,]\d{3})[^\d]{0,100}?([1-4][.,]\d{3})/gi;
      
      let match;
      while ((match = regex.exec(cleanText)) !== null) {
        const dateStartStr = match[1];
        const dateEndStr = match[2];
        const year = parseInt(match[3], 10);
        const pricePetrol = parseFloat(match[4].replace(',', '.'));
        const priceDiesel = parseFloat(match[5].replace(',', '.'));
        
        const startDate = parseDate(dateStartStr, year);
        const endDate = parseDate(dateEndStr, year);
        endDate.setHours(23, 59, 59, 999);

        const label = `${dateStartStr.replace(/\s/g, '')}-${dateEndStr.replace(/\s/g, '')}`;
        
        if (priceDiesel > 1.0 && priceDiesel < 3.0 && !dieselHistory.find(h => h.label === label)) {
          dieselHistory.push({ label, price: priceDiesel, startDate, endDate });
        }
        if (pricePetrol > 1.0 && pricePetrol < 3.0 && !petrolHistory.find(h => h.label === label)) {
          petrolHistory.push({ label, price: pricePetrol, startDate, endDate });
        }
      }

      if (dieselHistory.length >= 2 && petrolHistory.length >= 2) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        dieselHistory.sort((a, b) => a.startDate - b.startDate);
        let currentDiesel = dieselHistory.find(item => today >= item.startDate && today <= item.endDate) || dieselHistory[dieselHistory.length - 1];
        let dChart = [...dieselHistory].sort((a, b) => b.startDate - a.startDate).slice(0, 8).reverse();

        fuelData.diesel.price = currentDiesel.price.toFixed(3);
        fuelData.diesel.historyLabels = dChart.map(i => i.label);
        fuelData.diesel.historyPrices = dChart.map(i => i.price);

        petrolHistory.sort((a, b) => a.startDate - b.startDate);
        let currentPetrol = petrolHistory.find(item => today >= item.startDate && today <= item.endDate) || petrolHistory[petrolHistory.length - 1];
        let pChart = [...petrolHistory].sort((a, b) => b.startDate - a.startDate).slice(0, 8).reverse();

        fuelData.petrol.price = currentPetrol.price.toFixed(3);
        fuelData.petrol.historyLabels = pChart.map(i => i.label);
        fuelData.petrol.historyPrices = pChart.map(i => i.price);

        localStorage.setItem('diesel_price', fuelData.diesel.price);
        localStorage.setItem('diesel_history', JSON.stringify({ labels: fuelData.diesel.historyLabels, prices: fuelData.diesel.historyPrices }));
        
        localStorage.setItem('petrol95_price', fuelData.petrol.price);
        localStorage.setItem('petrol95_history', JSON.stringify({ labels: fuelData.petrol.historyLabels, prices: fuelData.petrol.historyPrices }));
        
        localStorage.setItem('fuel_last_update', new Date().toISOString());

        status.textContent = 'Samodejno posodobljeno s strani GOV.SI';
        status.className = 'text-[10px] text-emerald-400';
        dateEl.textContent = 'Vir: GOV.SI • Osveženo ' + new Date().toLocaleDateString('sl-SI');
        
        loadTabInputs();
        calculate();
        updateChart();
        historyFetched = true;
        break;
      }
    } catch (e) {
      console.warn("Napaka pri proxy povezavi:", url, e);
    }
  }

  if (!historyFetched) {
    status.textContent = 'Lokalno shranjeni podatki';
    status.className = 'text-[10px] text-yellow-400';
    const lastUpdate = localStorage.getItem('fuel_last_update');
    dateEl.textContent = lastUpdate ? 'Zadnja osvežitev: ' + new Date(lastUpdate).toLocaleDateString('sl-SI') : 'Brez povezave';
  }
}

function loadSavedData() {
  injectDynamicManifest();

  // Najprej preberemo shranjene podatke iz localStorage za oba zavihka
  const savedDieselPrice = localStorage.getItem('diesel_price');
  const savedDieselDiscount = localStorage.getItem('diesel_discount');
  const savedDieselHistory = localStorage.getItem('diesel_history');

  if (savedDieselPrice) fuelData.diesel.price = savedDieselPrice;
  if (savedDieselDiscount !== null) fuelData.diesel.discount = savedDieselDiscount;
  if (savedDieselHistory) {
    const h = JSON.parse(savedDieselHistory);
    fuelData.diesel.historyLabels = h.labels;
    fuelData.diesel.historyPrices = h.prices;
  } else {
    fuelData.diesel.historyLabels = ['14.7.-20.7.', '21.7.-27.7.', '28.7.-3.8.', '4.8.-10.8.'];
    fuelData.diesel.historyPrices = [1.520, 1.540, 1.530, 1.515];
  }

  const savedPetrolPrice = localStorage.getItem('petrol95_price');
  const savedPetrolDiscount = localStorage.getItem('petrol95_discount');
  const savedPetrolHistory = localStorage.getItem('petrol95_history');

  if (savedPetrolPrice) fuelData.petrol.price = savedPetrolPrice;
  if (savedPetrolDiscount !== null) fuelData.petrol.discount = savedPetrolDiscount;
  if (savedPetrolHistory) {
    const h = JSON.parse(savedPetrolHistory);
    fuelData.petrol.historyLabels = h.labels;
    fuelData.petrol.historyPrices = h.prices;
  } else {
    fuelData.petrol.historyLabels = ['14.7.-20.7.', '21.7.-27.7.', '28.7.-3.8.', '4.8.-10.8.'];
    fuelData.petrol.historyPrices = [1.480, 1.510, 1.490, 1.475];
  }

  const savedTab = localStorage.getItem('active_fuel_tab');
  if (savedTab === 'petrol' || savedTab === 'diesel') {
    activeTab = savedTab;
  }

  switchFuelTab(activeTab);
  checkInstallState();
  fetchFuelPrices();
}

function copyResult() {
  const finalPrice = document.getElementById('final-price').textContent;
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(finalPrice);
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = finalPrice;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }

  showToast('Znesek kopiran v odložišče!');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

window.onload = () => {
  loadSavedData();
};
</script>
