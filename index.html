<style>
body{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.011em}.mono{font-family:'JetBrains Mono',monospace}
.card{background:rgba(24,24,27,.94);border:1px solid #3f3f46;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.input{background:#09090b;border:1px solid #3f3f46;color:#fafafa;border-radius:10px;padding:.75rem 1rem;font-size:.9rem;width:100%;outline:none;transition:all 0.2s}
.input:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.1)}

input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.label{display:block;font-size:.75rem;font-weight:700;color:#d4d4d8;margin-bottom:.4rem}
.result{font-family:'JetBrains Mono',monospace;font-weight:700}

#toastWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{pointer-events:auto;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);border:1px solid;animation:toastIn .2s ease-out}
.toast-success{background:#064e3b;color:#a7f3d0;border-color:#059669}
.toast-danger{background:#7f1d1d;color:#fecaca;border-color:#dc2626}
.toast-info{background:#1e3a8a;color:#bfdbfe;border-color:#2563eb}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>

<body class="bg-zinc-950 text-zinc-100 min-h-screen p-3 md:p-6 flex flex-col items-center">

<div id="toastWrap"></div>

<div class="max-w-4xl w-full space-y-6">

  <!-- HEADER -->
  <div class="card p-5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center p-1">
        <svg viewBox="0 0 512 512" class="w-full h-full">
          <!-- Zunanja obroba mesa -->
          <path d="M110 330 C90 300 70 240 100 170 C130 100 220 80 320 100 C410 120 450 190 430 270 C410 350 330 410 240 410 C170 410 130 370 110 330 Z" fill="#b91c1c"/>
          <!-- Rdeča sredina mesa -->
          <path d="M120 320 C105 295 90 245 115 185 C140 125 215 105 305 122 C385 138 420 198 405 268 C390 338 318 390 238 390 C175 390 138 355 120 320 Z" fill="#ef4444"/>
          <!-- Senčenje spodaj -->
          <path d="M380 180 C330 190 270 230 220 300 C200 328 175 355 145 370 C165 382 200 390 238 390 C318 390 390 338 405 268 C413 230 402 201 380 180 Z" fill="#dc2626"/>
          <!-- Marbled maščobne linije -->
          <path d="M220 150 C260 155 290 170 310 195 C290 205 260 200 230 185 C210 175 200 160 220 150 Z" fill="#fecaca" opacity="0.8"/>
          <path d="M160 230 C200 250 220 280 220 320 C195 305 175 280 165 250 C155 235 152 225 160 230 Z" fill="#fecaca" opacity="0.8"/>
          <path d="M310 260 C350 280 370 310 360 340 C340 330 325 305 320 280 C315 268 310 260 310 260 Z" fill="#fecaca" opacity="0.8"/>
          <path d="M180 180 C190 160 220 135 255 130 C250 145 230 165 205 175 C190 181 180 180 180 180 Z" fill="#ffffff" opacity="0.6"/>
          <!-- Kost T-bone / runde -->
          <circle cx="320" cy="220" r="28" fill="#f8fafc"/>
          <circle cx="320" cy="220" r="18" fill="#e2e8f0"/>
          <circle cx="320" cy="220" r="10" fill="#09090b"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight">Obračun Mesa</h1>
        <p class="text-xs text-zinc-400">Preračun, cenik in evidenca klanja</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="installAppBtn" onclick="installPWA()" title="Namesti aplikacijo" class="hidden px-3 py-2 text-xs font-bold rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-red-400 flex items-center gap-2 transition-colors">
        📥 Namesti
      </button>
      <button onclick="odpriNastavitve()" class="px-3 py-2 text-xs font-bold rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 transition-colors">
        ⚙️ Cenik
      </button>
      <button onclick="odpriStatistiko()" class="px-3 py-2 text-xs font-bold rounded-xl bg-red-600/20 border border-red-500/30 text-red-400 hover:bg-red-600/30 transition-colors">
        📊 Statistika
      </button>
    </div>
  </div>

  <!-- GLAVNI MREŽNI PRIKAZ -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEVI STOLPEC: Obrazec -->
    <div class="lg:col-span-6 card p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h2 id="naslovObrazca" class="text-base font-bold text-zinc-200">Novi račun</h2>
        <span id="urejanjeBadge" class="hidden text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">Urejanje</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="label">Stranka</label>
          <input type="text" id="priimek" placeholder="Stranka" class="input">
        </div>
        <div>
          <label class="label">Datum klanja</label>
          <input type="date" id="datumKlanja" class="input">
        </div>
      </div>

      <div>
        <label class="label">Opombe (neobvezno)</label>
        <input type="text" id="opombe" placeholder="npr. brez rebrc, vse mleto..." class="input">
      </div>

      <!-- VNOS POSTAVKE -->
      <div class="bg-zinc-900/60 border border-zinc-800 p-3.5 rounded-xl space-y-3">
        <div class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Dodaj kos mesa</div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label">Del mesa</label>
            <select id="kosMesa" class="input" onchange="posodobiCenoPrikaz()"></select>
          </div>
          <div>
            <label class="label">Teža [kg]</label>
            <input type="number" id="teza" step="0.01" min="0" placeholder="0.00" class="input" onkeypress="allowComma(event)">
          </div>
        </div>
        <div class="flex items-center justify-between pt-1">
          <span class="text-xs text-zinc-400">Cena: <strong id="cenaNaKgPrikaz" class="text-zinc-100 mono">0.00 €/kg</strong></span>
          <button onclick="dodajPostavko()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-red-600 hover:bg-red-500 text-white transition-colors">
            + Dodaj
          </button>
        </div>
      </div>

      <!-- TABELA POSTAVEK -->
      <div class="overflow-x-auto min-h-[120px]">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-zinc-800 text-zinc-500">
              <th class="py-2">Kos</th>
              <th class="py-2 text-right">€/kg</th>
              <th class="py-2 text-right">kg</th>
              <th class="py-2 text-right">Skupaj</th>
              <th class="py-2 text-center"></th>
            </tr>
          </thead>
          <tbody id="tabelaPostavk" class="divide-y divide-zinc-800/50"></tbody>
        </table>
      </div>

      <!-- ZNESEK ZA PLAČILO -->
      <div class="border-t border-zinc-800 pt-4 flex items-center justify-between">
        <div>
          <div class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Skupaj za plačilo</div>
          <div id="skupajZaPlacilo" class="text-2xl font-extrabold text-red-500 result">0.00 €</div>
        </div>
        <div class="flex gap-2">
          <button id="btnPrekliciUrejanje" onclick="prekliciUrejanje()" class="hidden px-3 py-2 text-xs font-bold rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300">Prekliči</button>
          <button onclick="shraniRacun()" class="px-4 py-2 text-xs font-bold rounded-xl bg-red-600 hover:bg-red-500 text-white transition-colors">Shrani račun</button>
        </div>
      </div>
    </div>

    <!-- DESNI STOLPEC: Shranjeni računi -->
    <div class="lg:col-span-6 card p-5 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-zinc-800 pb-3">
        <h2 class="text-base font-bold text-zinc-200">Shranjeni računi</h2>
        <button onclick="izvoziVseRacuneTxt()" class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700">Izvozi TXT</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <select id="filterDatum" onchange="prikaziShranjeneRacune()" class="input py-1.5 text-xs"><option value="vsi">Vsi datumi</option></select>
        <input type="text" id="iskanje" oninput="prikaziShranjeneRacune()" placeholder="Išči stranko..." class="input py-1.5 text-xs">
      </div>

      <div id="seznamRacunov" class="space-y-3 max-h-[480px] overflow-y-auto pr-1"></div>
    </div>

  </div>
</div>

<!-- MODAL: Nastavitve cenika -->
<div id="modalNastavitve" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
  <div class="card max-w-md w-full p-5 space-y-4">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
      <h3 class="text-base font-bold">Urejanje cenika</h3>
      <button onclick="zapriNastavitve()" class="text-zinc-400 hover:text-white">✕</button>
    </div>
    <div class="bg-zinc-900/50 p-3 rounded-xl border border-zinc-800 space-y-2">
      <div class="text-xs font-bold text-zinc-400">Dodaj nov kos</div>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="novKosIme" placeholder="Naziv kosa" class="input text-xs py-1.5">
        <input type="number" id="novKosCena" step="0.1" placeholder="€/kg" class="input text-xs py-1.5" onkeypress="allowComma(event)">
      </div>
      <button onclick="dodajNovKosMesa()" class="w-full py-1.5 text-xs font-bold bg-red-600 hover:bg-red-500 rounded-lg text-white">Dodaj na cenik</button>
    </div>
    <div id="seznamCenika" class="max-h-48 overflow-y-auto space-y-1.5 pr-1"></div>
    <div class="border-t border-zinc-800 pt-3 flex justify-between">
      <button onclick="exportPodatki()" class="text-xs font-bold text-zinc-400 hover:text-zinc-200">📥 Izvoz JSON</button>
      <button onclick="document.getElementById('uvozInput').click()" class="text-xs font-bold text-zinc-400 hover:text-zinc-200">📤 Uvoz JSON</button>
      <input type="file" id="uvozInput" accept="application/json" class="hidden" onchange="importPodatki(event)">
    </div>
    <div class="pt-2 text-right">
      <button onclick="zapriNastavitve()" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-zinc-800 hover:bg-zinc-700">Zapri</button>
    </div>
  </div>
</div>

<!-- MODAL: Statistika -->
<div id="modalStatistika" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
  <div class="card max-w-xl w-full p-5 space-y-4">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
      <h3 class="text-base font-bold">Skupna statistika klanja</h3>
      <button onclick="zapriStatistiko()" class="text-zinc-400 hover:text-white">✕</button>
    </div>
    <div class="flex items-center gap-3">
      <label class="text-xs text-zinc-400 font-bold">Datum klanja:</label>
      <select id="statistikaDatum" onchange="izracunajInPrikaziStatistiko()" class="input text-xs py-1.5 w-auto"><option value="vsi">Vsa klanja</option></select>
    </div>
    <div class="max-h-60 overflow-y-auto border border-zinc-800 rounded-xl">
      <table class="w-full text-left text-xs">
        <thead class="bg-zinc-900 text-zinc-400 border-b border-zinc-800">
          <tr><th class="p-2.5">Kos</th><th class="p-2.5 text-right">Teža (kg)</th><th class="p-2.5 text-right">Vrednost (€)</th></tr>
        </thead>
        <tbody id="tabelaStatistike" class="divide-y divide-zinc-800/50"></tbody>
      </table>
    </div>
    <div class="flex justify-between items-center border-t border-zinc-800 pt-3">
      <span class="text-xs text-zinc-400">Skupaj teža: <strong id="statSkupnaTeza" class="text-zinc-100 mono">0 kg</strong></span>
      <span class="text-xs text-zinc-400">Skupaj vrednost: <strong id="statSkupnaVrednost" class="text-red-400 mono">0.00 €</strong></span>
    </div>
    <div class="text-right pt-2">
      <button onclick="zapriStatistiko()" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-zinc-800 hover:bg-zinc-700">Zapri</button>
    </div>
  </div>
</div>

<script>
function generirajSistemskeIkone() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#09090b';
  ctx.beginPath();
  ctx.roundRect(0, 0, 512, 512, 90);
  ctx.fill();

  const pBase = new Path2D('M110 330 C90 300 70 240 100 170 C130 100 220 80 320 100 C410 120 450 190 430 270 C410 350 330 410 240 410 C170 410 130 370 110 330 Z');
  const pRed = new Path2D('M120 320 C105 295 90 245 115 185 C140 125 215 105 305 122 C385 138 420 198 405 268 C390 338 318 390 238 390 C175 390 138 355 120 320 Z');
  const pShade = new Path2D('M380 180 C330 190 270 230 220 300 C200 328 175 355 145 370 C165 382 200 390 238 390 C318 390 390 338 405 268 C413 230 402 201 380 180 Z');
  
  const pFat1 = new Path2D('M220 150 C260 155 290 170 310 195 C290 205 260 200 230 185 C210 175 200 160 220 150 Z');
  const pFat2 = new Path2D('M160 230 C200 250 220 280 220 320 C195 305 175 280 165 250 C155 235 152 225 160 230 Z');
  const pFat3 = new Path2D('M310 260 C350 280 370 310 360 340 C340 330 325 305 320 280 C315 268 310 260 310 260 Z');
  const pFat4 = new Path2D('M180 180 C190 160 220 135 255 130 C250 145 230 165 205 175 C190 181 180 180 180 180 Z');

  ctx.save();
  ctx.translate(56, 56);
  ctx.scale(0.78, 0.78);

  ctx.fillStyle = '#b91c1c'; ctx.fill(pBase);
  ctx.fillStyle = '#ef4444'; ctx.fill(pRed);
  ctx.fillStyle = '#dc2626'; ctx.fill(pShade);
  
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#fecaca'; 
  ctx.fill(pFat1); ctx.fill(pFat2); ctx.fill(pFat3);
  
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#ffffff'; ctx.fill(pFat4);
  
  ctx.globalAlpha = 1.0;
  ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(320, 220, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(320, 220, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#09090b'; ctx.beginPath(); ctx.arc(320, 220, 10, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  const pngUrl = canvas.toDataURL('image/png');
  document.getElementById('appleIcon').setAttribute('href', pngUrl);

  const manifest = {
    "name": "Obračun Mesa",
    "short_name": "Meso",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#09090b",
    "theme_color": "#09090b",
    "icons": [
      { "src": pngUrl, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  document.getElementById('manifestLink').setAttribute('href', URL.createObjectURL(manifestBlob));
}
generirajSistemskeIkone();

let cenik = JSON.parse(localStorage.getItem('mesnica_cenik')) || {
  "Kare":12, "Stegno":13, "Stegno s kostmi":12, "Pleče":10, "Vrat":10, "Rebra":8, "Flam":8, "Prsa":8, "Kosti":2, "Faširano":10
};
let trenutnePostavke = [];
let shranjeniRacuni = JSON.parse(localStorage.getItem('mesnica_racuni')) || [];
let idUrejevanja = null;
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.classList.remove('hidden');
});

async function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') toast('Aplikacija se namešča...');
    deferredPrompt = null;
    document.getElementById('installAppBtn').classList.add('hidden');
  }
}

window.addEventListener('appinstalled', () => {
  document.getElementById('installAppBtn').classList.add('hidden');
  deferredPrompt = null;
  toast('Aplikacija je nameščena na telefon!');
});

function allowComma(e) {
  if (e.key === ',') {
    e.preventDefault();
    const input = e.target;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + '.' + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + 1;
    input.dispatchEvent(new Event('input'));
  }
}

function toast(msg, tip='success'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast toast-${tip}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 3000);
}

function shraniCenikVShrambo(){ localStorage.setItem('mesnica_cenik', JSON.stringify(cenik)); }

function napolniIzbiroMesa(){
  const select = document.getElementById('kosMesa'); select.innerHTML='';
  Object.keys(cenik).forEach(kos=>{
    const o=document.createElement('option'); o.value=kos; o.textContent=kos; select.appendChild(o);
  });
  posodobiCenoPrikaz();
}

function posodobiCenoPrikaz(){
  const izbranKos = document.getElementById('kosMesa').value;
  if(izbranKos && cenik[izbranKos]!==undefined) document.getElementById('cenaNaKgPrikaz').textContent = `${cenik[izbranKos].toFixed(2)} €/kg`;
}

function dodajPostavko(){
  const kos = document.getElementById('kosMesa').value;
  const teza = parseFloat(document.getElementById('teza').value.replace(',', '.'));
  if(!kos){ toast('Izberite kos mesa.','danger'); return; }
  if(isNaN(teza)||teza<=0){ toast('Vnesite veljavno težo.','danger'); return; }
  const cenaNaKg = cenik[kos]; const skupnaCena = teza*cenaNaKg;
  trenutnePostavke.push({kos,cenaNaKg,teza,skupnaCena});
  document.getElementById('teza').value=''; osveziTabeloPostavk();
}

function odstraniPostavko(index){ trenutnePostavke.splice(index,1); osveziTabeloPostavk(); }

function osveziTabeloPostavk(){
  const tbody = document.getElementById('tabelaPostavk'); tbody.innerHTML='';
  if(trenutnePostavke.length===0){
    tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-zinc-500 italic">Ni dodanih postavk.</td></tr>`;
    document.getElementById('skupajZaPlacilo').textContent='0.00 €'; return;
  }
  let skupaj=0;
  trenutnePostavke.forEach((p,index)=>{
    skupaj += p.skupnaCena;
    const tr=document.createElement('tr');
    tr.innerHTML = `
      <td class="py-2 font-medium text-zinc-200">${p.kos}</td>
      <td class="py-2 text-right mono text-zinc-400">${p.cenaNaKg.toFixed(2)}</td>
      <td class="py-2 text-right mono text-zinc-300">${p.teza.toFixed(2)}</td>
      <td class="py-2 text-right mono font-bold text-red-400">${p.skupnaCena.toFixed(2)} €</td>
      <td class="py-2 text-center"><button onclick="odstraniPostavko(${index})" class="text-red-400 font-bold hover:text-red-300">✕</button></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('skupajZaPlacilo').textContent = `${skupaj.toFixed(2)} €`;
}

function shraniRacun(){
  const priimek = document.getElementById('priimek').value.trim();
  const datumKlanja = document.getElementById('datumKlanja').value;
  const opombe = document.getElementById('opombe').value.trim();
  if(!priimek){ toast('Vnesite stranko.','danger'); return; }
  if(!datumKlanja){ toast('Izberite datum klanja.','danger'); return; }
  if(trenutnePostavke.length===0){ toast('Dodajte vsaj eno postavko.','danger'); return; }
  
  const skupnaVrednost = trenutnePostavke.reduce((s,p)=>s+p.skupnaCena,0);
  if(idUrejevanja){
    const idx = shranjeniRacuni.findIndex(r=>r.id===idUrejevanja);
    if(idx!==-1) shranjeniRacuni[idx] = {...shranjeniRacuni[idx], priimek, datumKlanja, opombe, postavke:[...trenutnePostavke], skupaj:skupnaVrednost};
    prekliciUrejanje(); toast('Račun posodobljen.');
  } else {
    shranjeniRacuni.unshift({id:Date.now(), priimek, datumKlanja, opombe, postavke:[...trenutnePostavke], skupaj:skupnaVrednost});
    toast('Račun shranjen.');
  }
  localStorage.setItem('mesnica_racuni', JSON.stringify(shranjeniRacuni));
  document.getElementById('priimek').value=''; document.getElementById('opombe').value='';
  trenutnePostavke=[]; osveziTabeloPostavk(); osveziFiltreDatumov(); prikaziShranjeneRacune();
}

function urediRacun(id){
  const racun = shranjeniRacuni.find(r=>r.id===id); if(!racun) return;
  idUrejevanja=id;
  document.getElementById('priimek').value = racun.priimek;
  document.getElementById('datumKlanja').value = racun.datumKlanja || new Date().toISOString().split('T')[0];
  document.getElementById('opombe').value = racun.opombe || '';
  trenutnePostavke = JSON.parse(JSON.stringify(racun.postavke));
  osveziTabeloPostavk();
  document.getElementById('naslovObrazca').textContent = "Uredi račun";
  document.getElementById('urejanjeBadge').classList.remove('hidden');
  document.getElementById('btnPrekliciUrejanje').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function prekliciUrejanje(){
  idUrejevanja=null;
  document.getElementById('priimek').value=''; document.getElementById('opombe').value='';
  trenutnePostavke=[]; osveziTabeloPostavk();
  document.getElementById('naslovObrazca').textContent = "Novi račun";
  document.getElementById('urejanjeBadge').classList.add('hidden');
  document.getElementById('btnPrekliciUrejanje').classList.add('hidden');
}

function izbrisiRacun(id){
  if(confirm("Res želiš izbrisati ta račun?")){
    shranjeniRacuni = shranjeniRacuni.filter(r=>r.id!==id);
    localStorage.setItem('mesnica_racuni', JSON.stringify(shranjeniRacuni));
    if(idUrejevanja===id) prekliciUrejanje();
    osveziFiltreDatumov(); prikaziShranjeneRacune(); toast('Račun izbrisan.','info');
  }
}

function osveziFiltreDatumov(){
  const datumi=[...new Set(shranjeniRacuni.map(r=>r.datumKlanja).filter(Boolean))].sort().reverse();
  const filterSelect=document.getElementById('filterDatum'), statSelect=document.getElementById('statistikaDatum');
  filterSelect.innerHTML='<option value="vsi">Vsi datumi</option>';
  statSelect.innerHTML='<option value="vsi">Vsa klanja</option>';
  datumi.forEach(d=>{ 
    const l=urediPrikazDatuma(d); 
    filterSelect.innerHTML+=`<option value="${d}">${l}</option>`; 
    statSelect.innerHTML+=`<option value="${d}">${l}</option>`; 
  });
}

function urediPrikazDatuma(dStr){ if(!dStr) return ''; const p=dStr.split('-'); return p.length===3 ? `${p[2]}.${p[1]}.${p[0]}` : dStr; }

function prikaziShranjeneRacune(){
  const seznam=document.getElementById('seznamRacunov'); seznam.innerHTML='';
  const iskanje=document.getElementById('iskanje').value.toLowerCase();
  const izbranDatum=document.getElementById('filterDatum').value;
  
  const filtrirani = shranjeniRacuni.filter(r=>{
    const ujemaBesedilo = r.priimek.toLowerCase().includes(iskanje) || (r.opombe||'').toLowerCase().includes(iskanje);
    const ujemaDatum = izbranDatum==='vsi' || r.datumKlanja===izbranDatum;
    return ujemaBesedilo && ujemaDatum;
  });

  if(filtrirani.length===0){
    seznam.innerHTML = `<div class="p-6 text-center text-xs text-zinc-500 italic">Ni shranjenih računov.</div>`;
    return;
  }

  filtrirani.forEach(racun=>{
    const div=document.createElement('div');
    div.className="p-3.5 rounded-xl bg-zinc-900/60 border border-zinc-800 text-xs space-y-2";
    const postavkeHtml = racun.postavke.map(p=>`<li class="flex justify-between text-zinc-400 py-0.5 border-b border-zinc-800/40 last:border-0"><span>${p.kos} (${p.teza} kg)</span><span class="mono text-zinc-200">${p.skupnaCena.toFixed(2)} €</span></li>`).join('');
    div.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <strong class="text-sm font-bold text-zinc-100">${racun.priimek}</strong>
          <div class="text-[10px] text-zinc-400">Klanje: ${urediPrikazDatuma(racun.datumKlanja)}</div>
        </div>
        <div class="text-right">
          <span class="font-extrabold text-sm text-red-400 mono">${racun.skupaj.toFixed(2)} €</span>
          <div class="flex gap-2 mt-1 justify-end text-[11px] font-bold">
            <button onclick="kopirajRacunTxt(${racun.id})" class="text-cyan-400 hover:text-cyan-300">Kopiraj</button>
            <button onclick="urediRacun(${racun.id})" class="text-amber-400 hover:text-amber-300">Uredi</button>
            <button onclick="izbrisiRacun(${racun.id})" class="text-red-400 hover:text-red-300">Izbriši</button>
          </div>
        </div>
      </div>
      <ul class="p-2 rounded-lg bg-zinc-950/50 border border-zinc-800/80">${postavkeHtml}</ul>
      ${racun.opombe ? `<p class="text-[11px] italic text-zinc-400">📝 ${racun.opombe}</p>` : ''}`;
    seznam.appendChild(div);
  });
}

function odpriNastavitve(){ prikaziCenikVNastavitvah(); document.getElementById('modalNastavitve').classList.remove('hidden'); document.getElementById('modalNastavitve').classList.add('flex'); }
function zapriNastavitve(){ document.getElementById('modalNastavitve').classList.add('hidden'); document.getElementById('modalNastavitve').classList.remove('flex'); napolniIzbiroMesa(); }

function prikaziCenikVNastavitvah(){
  const container=document.getElementById('seznamCenika'); container.innerHTML='';
  Object.keys(cenik).forEach(kos=>{
    const div=document.createElement('div');
    div.className="flex items-center justify-between p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-xs";
    div.innerHTML = `<span class="font-medium text-zinc-200">${kos}</span>
      <div class="flex items-center gap-1">
        <input type="number" step="0.1" value="${cenik[kos]}" onchange="posodobiCenoMesa('${kos}', this.value)" class="input w-16 py-1 text-right text-xs mono" onkeypress="allowComma(event)">
        <span class="text-zinc-500">€/kg</span>
        <button onclick="izbrisiKosMesa('${kos}')" class="text-red-400 font-bold ml-1">✕</button>
      </div>`;
    container.appendChild(div);
  });
}

function posodobiCenoMesa(kos, novaCena){
  const val=parseFloat(novaCena.replace(',', '.'));
  if(!isNaN(val)&&val>=0){ cenik[kos]=val; shraniCenikVShrambo(); toast(`Cena za "${kos}" posodobljena.`,'info'); }
}

function izbrisiKosMesa(kos){
  if(confirm(`Odstranim "${kos}" iz cenika?`)){ delete cenik[kos]; shraniCenikVShrambo(); prikaziCenikVNastavitvah(); }
}

function dodajNovKosMesa(){
  const ime=document.getElementById('novKosIme').value.trim();
  const cena=parseFloat(document.getElementById('novKosCena').value.replace(',', '.'));
  if(!ime || isNaN(cena)){ toast('Vnesite pravilno ime in ceno.','danger'); return; }
  cenik[ime]=cena; shraniCenikVShrambo();
  document.getElementById('novKosIme').value=''; document.getElementById('novKosCena').value='';
  prikaziCenikVNastavitvah(); toast(`Kos "${ime}" dodan.`);
}

function exportPodatki(){
  const blob = new Blob([JSON.stringify({cenik, racuni:shranjeniRacuni},null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `obracun-mesa-backup.json`; a.click();
}

function importPodatki(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const d = JSON.parse(evt.target.result);
      if(d.cenik && d.racuni){ cenik=d.cenik; shranjeniRacuni=d.racuni; shraniCenikVShrambo(); localStorage.setItem('mesnica_racuni', JSON.stringify(shranjeniRacuni)); location.reload(); }
    }catch(err){ toast('Datoteka ni veljavna.','danger'); }
  };
  reader.readAsText(file);
}

function oblikujRacunVTxt(r){
  let txt = `========================================\n`;
  txt += `RAČUN - OBRAČUN MESA\n`;
  txt += `Stranka: ${r.priimek}\n`;
  txt += `Datum: ${urediPrikazDatuma(r.datumKlanja)}\n`;
  if(r.opombe) txt += `Opombe: ${r.opombe}\n`;
  txt += `----------------------------------------\n`;
  txt += `POSTAVKE:\n`;
  r.postavke.forEach(p => { 
    txt += `- ${p.kos.padEnd(16)}: ${p.teza.toFixed(2).padStart(6)} kg x ${p.cenaNaKg.toFixed(2).padStart(5)} EUR/kg = ${p.skupnaCena.toFixed(2).padStart(7)} EUR\n`; 
  });
  txt += `----------------------------------------\n`;
  txt += `SKUPAJ ZA PLAČILO: ${r.skupaj.toFixed(2)} EUR\n`;
  txt += `========================================\n`;
  return txt;
}

function kopirajRacunTxt(id){
  const r = shranjeniRacuni.find(x=>x.id===id); if(!r) return;
  navigator.clipboard.writeText(oblikujRacunVTxt(r)); toast('Kopirano v odložišče!');
}

function izvoziVseRacuneTxt(){
  if(shranjeniRacuni.length===0){ toast('Ni računov za izvoz.','danger'); return; }
  let txt = `OBRAČUN MESA - IZVOZ RAČUNOV\n\n`;
  shranjeniRacuni.forEach(r => { txt += oblikujRacunVTxt(r) + `\n\n`; });
  
  const blob = new Blob(['\uFEFF' + txt], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vsi_racuni_mesa.txt`;
  a.click();
}

function odpriStatistiko(){ osveziFiltreDatumov(); izracunajInPrikaziStatistiko(); document.getElementById('modalStatistika').classList.remove('hidden'); document.getElementById('modalStatistika').classList.add('flex'); }
function zapriStatistiko(){ document.getElementById('modalStatistika').classList.add('hidden'); document.getElementById('modalStatistika').classList.remove('flex'); }

function izracunajInPrikaziStatistiko(){
  const d = document.getElementById('statistikaDatum').value;
  const zbirnik={}; let skupnaT=0, skupnaV=0;
  shranjeniRacuni.forEach(r=>{
    if(d==='vsi' || r.datumKlanja===d){
      r.postavke.forEach(p=>{
        if(!zbirnik[p.kos]) zbirnik[p.kos]={teza:0,vrednost:0};
        zbirnik[p.kos].teza+=p.teza; zbirnik[p.kos].vrednost+=p.skupnaCena;
        skupnaT+=p.teza; skupnaV+=p.skupnaCena;
      });
    }
  });
  const tbody=document.getElementById('tabelaStatistike'); tbody.innerHTML='';
  Object.keys(zbirnik).sort((a,b)=>zbirnik[b].teza-zbirnik[a].teza).forEach(k=>{
    const tr=document.createElement('tr');
    tr.innerHTML = `<td class="p-2.5 font-medium text-zinc-200">${k}</td><td class="p-2.5 text-right mono text-zinc-300">${zbirnik[k].teza.toFixed(2)} kg</td><td class="p-2.5 text-right mono text-red-400 font-bold">${zbirnik[k].vrednost.toFixed(2)} €</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('statSkupnaTeza').textContent = `${skupnaT.toFixed(2)} kg`;
  document.getElementById('statistikaDatum').value = d;
  document.getElementById('statSkupnaVrednost').textContent = `${skupnaV.toFixed(2)} €`;
}

window.onload = () => {
  document.getElementById('datumKlanja').value = new Date().toISOString().split('T')[0];
  napolniIzbiroMesa(); osveziFiltreDatumov(); prikaziShranjeneRacune();
};
</script>
</body>
</html>
